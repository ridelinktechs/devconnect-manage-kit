name: devconnect_manage_tool
description: "DevConnect Manage Tool - Desktop debugging & inspection tool for React Native, Flutter, and Android apps"
publish_to: 'none'
version: 1.1.0+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^17.5.0

  # Code Generation / Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  flex_color_scheme: ^8.1.1
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  multi_split_view: ^3.1.0
  lucide_icons_flutter: ^3.1.11

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  path_provider: ^2.1.5
  window_manager: ^0.5.2
  file_selector_platform_interface: ^2.7.0
  file_selector: ^1.1.0
  http: ^1.2.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.3
  json_serializable: ^6.11.0
  riverpod_generator: ^3.0.3
  msix: ^3.18.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - docs/donate/

# The Windows MSIX the release workflow builds. Same identity as v1.0.0's
# and, like it, signed with msix's test certificate, so it updates that
# install; users trust that certificate once before installing.
msix_config:
  display_name: DevConnect Manage Tool
  publisher_display_name: RideLinkTech
  identity_name: com.ridelinktech.devconnect
  logo_path: macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png
  capabilities: internetClient
  install_certificate: false
